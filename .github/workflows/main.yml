name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.4'
          - '4.0'

    steps:
    # not using cache for apt packages because of
    # https://github.com/awalsh128/cache-apt-pkgs-action/issues/158
    # - uses: awalsh128/cache-apt-pkgs-action@latest
    #   with:
    #     packages: libvips libglib2.0-0 libglib2.0-dev libwebp-dev libvips42 libpng-dev
    #     version: tests-v1
    - name: Install dependencies for snap_diff-capybara
      run: |
        sudo apt-get update
        sudo apt-get -y install libvips libglib2.0-0 libglib2.0-dev libwebp-dev libvips42 libpng-dev
      shell: bash

    - uses: nanasess/setup-chromedriver@v2
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Install JS dependencies
      run: npm install
    - name: Run the default task
      run: bundle exec rake
    - uses: codecov/codecov-action@v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots-${{ matrix.ruby }}
        retention-days: 1
        path: 'spec/screenshots'
